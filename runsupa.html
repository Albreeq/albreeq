<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة النظام | البريق التقني المميز</title>
    <link rel="icon" href="favico.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="style.css">
    <style>
        .portal-wrapper {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .portal-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }
        .portal-badge {
            display: inline-block;
            background: #EFF6FF;
            color: #1D4ED8;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid #BFDBFE;
        }
        .portal-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: #111827;
            margin-bottom: 12px;
        }
        .portal-desc {
            color: #4B5563;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .launch-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #1D4ED8;
            color: #FFFFFF;
            font-weight: 800;
            font-size: 1rem;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(29, 78, 216, 0.25);
            width: 100%;
        }
        .launch-btn:hover {
            background: #1E40AF;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(29, 78, 216, 0.35);
        }
    </style>
</head>
<body>

    <main class="portal-wrapper">
        <div class="portal-card">
            <span class="portal-badge">منصة الاستضافة السحابية الآمنة</span>
            <h1 class="portal-title">بوابة النظام الموحد</h1>
            <p class="portal-desc">مرحباً بكم في منصة البريق التقني المميز. انقر على الرابط أدناه للانتقال إلى المحرك التقني والتحقق من الهوية عبر السحابة.</p>
            
            <!-- Standard Anchor Link to Obfuscated File Path -->
            <a href="sys_data/bin/core/vault/supaapi.html" class="launch-btn" id="launchEngineLink">
                <span>الدخول إلى النظام التقني</span>
                <span style="font-size: 1.2rem;">←</span>

        </div>
    </main>

</body>
</html>

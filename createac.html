<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- SAFE URL MASKING: Yields execution if auth hash is present -->
    <script>
        (function guardAuthHash() {
            try {
                const hash = window.location.hash || '';
                const search = window.location.search || '';
                if (hash.includes('access_token') || hash.includes('error') || search.includes('code=')) {
                    return; // DO NOT TOUCH THE URL
                }
                const pathSegments = window.location.pathname.split('/');
                const pageIndex = pathSegments.indexOf('createac.html');
                let targetRoot = '/';
                if (pageIndex > 0) {
                    targetRoot = pathSegments.slice(0, pageIndex).join('/') + '/';
                }
                window.history.replaceState(null, document.title, targetRoot);
            } catch (err) {
                console.warn('URL Masking Error:', err);
            }
        })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | البريق التقني المميز</title>

    <style>
        .google-oauth-btn {
            display: flex;

            border-color: #CBD5E1;

        .google-oauth-btn svg {

            flex-shrink: 0;
        }
        .auth-status-banner {
            padding: 10px 14px;
            border-radius: var(--radius-sm, 6px);
            font-size: 0.85rem;
            font-weight: 700;
            text-align: center;
            display: none;
            margin-bottom: 12px;
        }
        .auth-status-banner.error {
            background: #FEE2E2;
            color: #DC2626;
            border: 1px solid #FECACA;
            display: block;
        }
        .auth-status-banner.success {
            background: #ECFDF5;
            color: #16A34A;
            border: 1px solid #A7F3D0;
            display: block;
        }
    </style>
</head>
<body>
    <script src="color.js"></script>

    <div class="auth-wrapper">
        <nav class="auth-nav">
            <button id="darkModeToggle" class="theme-btn">الوضع الداكن</button>
            <a href="index.html" class="logo-text">البريق التقني المميز</a>
        </nav>

        <main class="auth-card">
            <div class="card-header">
                <h1 class="h">عضوية جديدة</h1>
                <p class="subtitle">ابدأ رحلتك مع خدمات العقارات والأنظمة الذكية اليوم</p>
            </div>

            <div id="authStatusBanner" class="auth-status-banner"></div>

            <form class="auth-form" id="signUpForm" onsubmit="event.preventDefault(); handleSupabaseSignUp();">
                
                <div class="input-wrapper">
                    <label for="username">الاسم الكامل</label>
                    <div class="input-box">
                        <input type="text" id="username" placeholder="عبدالله محمد" required autocomplete="name">
                    </div>
                </div>

                <div class="input-wrapper">
                    <label for="email">البريد الإلكتروني</label>
                    <div class="input-box">
                        <input type="email" id="email" placeholder="mail@domain.com" required autocomplete="email">
                    </div>
                </div>

                <div class="input-wrapper">
                    <label for="password">كلمة المرور</label>
                    <div class="input-box">
                        <input type="password" id="password" placeholder="أدخل 8 رموز على الأقل" required minlength="8" autocomplete="new-password">
                    </div>
                </div>

                <div class="terms-check">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">أوافق على <a href="#">شروط الخدمة</a> و <a href="#">سياسة الخصوصية</a></label>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">إنشــــاء الحساب</button>

                <div class="divider">
                    <span>أو سجل عبر</span>
                </div>
                
                <div class="google-outer-container">
                    <button type="button" class="google-oauth-btn" id="googleOAuthBtn" onclick="signInWithGoogle()">
                        <svg viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        <span>التسجيل باستخدام Google</span>
                    </button>
                </div>

                <div id="statusMessage" class="status-msg"></div>
            </form>

            <footer class="card-footer">

    </div>

    <footer class="auth-page-footer" role="contentinfo">

    <!-- SUPABASE AUTHENTICATION ENGINE -->
    <script>
        const SUPABASE_URL = "https://dughjpjcaanzgclbrqtj.supabase.co";
        const SUPABASE_KEY = "sb_publishable_D70rSP53C3RD8uN6-a2niA_MngyAxn0";
        const GOOGLE_CLIENT_ID = "26469138120-ia1vg199gbpq1680q5qiccbk8bodmmou.apps.googleusercontent.com";

        let supabaseClient = null;
        if (typeof supabase !== 'undefined' && SUPABASE_URL && SUPABASE_KEY) {
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } catch (err) {
                console.error("Supabase init error:", err);
            }
        }

        function showAuthBanner(message, type = 'error') {
            const banner = document.getElementById('authStatusBanner');
            if (!banner) return;
            banner.textContent = message;
            banner.className = `auth-status-banner ${type}`;
        }

        // --- Google OAuth Sign In / Sign Up ---
        async function signInWithGoogle() {
            if (!supabaseClient) {
                showAuthBanner("تعذر تهيئة عميل المصادقة السحابي.");
                return;
            }

            try {
                const redirectTarget = window.location.origin;
                const { data, error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: redirectTarget
                    }
                });

                if (error) {
                    showAuthBanner("خطأ في التسجيل عبر Google: " + error.message);
                }
            } catch (err) {
                showAuthBanner("حدث خطأ غير متوقع أثناء المعالجة.");
            }
        }

        // --- Supabase Email/Password Registration ---
        async function handleSupabaseSignUp() {
            const username = document.getElementById('username')?.value.trim();
            const email = document.getElementById('email')?.value.trim();
            const password = document.getElementById('password')?.value;
            const termsChecked = document.getElementById('terms')?.checked;
            const submitBtn = document.getElementById('submitBtn');

            if (!username || !email || !password) return;

            if (!termsChecked) {
                showAuthBanner("يرجى الموافقة على شروط الخدمة وسياسة الخصوصية للمتابعة.");
                return;
            }

            if (!supabaseClient) return;

            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerText = "جاري إنشاء الحساب...";
            }

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: username
                        }
                    }
                });

                if (error) {
                    showAuthBanner(error.message);
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerText = "إنشــــاء الحساب";
                    }
                } else if (data && data.session) {
                    persistSessionAndRedirect(data.session);
                } else if (data && data.user) {
                    showAuthBanner("تم إنشاء الحساب بنجاح! يرجى التحقق من بريدك الإلكتروني لتأكيد التسجيل.", "success");
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerText = "تم الإرسال بنجاح";
                    }
                }
            } catch (err) {
                showAuthBanner("حدث خطأ غير متوقع أثناء إنشاء الحساب.");
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "إنشــــاء الحساب";
                }
            }
        }

        // --- Secure Session State Persistence ---
        function persistSessionAndRedirect(session) {
            if (!session || !session.user) return;
            const user = session.user;
            const meta = user.user_metadata || {};

            const username = meta.full_name || meta.name || user.email.split('@')[0];
            const safeUserData = {
                username: username,
                email: user.email,
                avatar: meta.avatar_url || meta.picture || ""
            };

            localStorage.setItem('currentUser', JSON.stringify(safeUserData));
            localStorage.setItem('isLoggedIn', 'true');

            // Route to store
            window.location.href = "store.html";
        }

        // --- Persistent Auth Listener ---
        document.addEventListener('DOMContentLoaded', async () => {
            if (!supabaseClient) return;

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session && session.user) {
                    persistSessionAndRedirect(session);
                    return;
                }
            } catch (err) {
                console.warn("Session check error:", err);
            }

            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' && session) {
                    persistSessionAndRedirect(session);
                }
            });
        });
    </script>
</body>
</html>
